    devices: "0"
    max_num_seqs: 1
    enforce_eager: true
    model_class_name: Cosmos3NanoSimTransferPipeline
    model_config:
      action_gen: false
      guardrails: false
      default_fps: 15.0
      default_resolution: [720, 1280]
      max_pixels: 921600
      overlap_vae_decode: true
